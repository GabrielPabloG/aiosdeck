# agent_capabilities.yaml — maps agent name -> capabilities
# Capabilities: filesystem (read/write with optional restriction), shell, git, internet, approval_required
reviewer:
  filesystem:
    - read
  shell: false

tester:
  filesystem:
    - read
  shell: true

documentation:
  filesystem:
    - read
    - write
  shell: false

research:
  internet: true

git:
  git: true
