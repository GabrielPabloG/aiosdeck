# agent_capabilities.yaml — canonical capability grants per agent.
# Capabilities: filesystem (read/write), shell, git, internet, ask_user.
# The canonical source of truth is src/aios/security/capabilities.py; this
# file is the human-readable reference used by the compliance tests.
planner:
  filesystem:
    - read
  ask_user: true

research:
  filesystem:
    - read

developer:
  filesystem:
    - read
    - write
  shell: true

reviewer:
  filesystem:
    - read
  shell: false

tester:
  filesystem:
    - read
  shell: true

documentation:
  filesystem:
    - read
    - write
  shell: false

git:
  git: true
