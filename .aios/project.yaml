# .aios/project.yaml — Project manifest for AiosDeck
# ProjDesk prepares the development environment.
# AiosDeck prepares the intelligence environment.

name: aiosdeck
runtime: opencode
sandbox: ai-jail

routing:
  enabled: true
  default_provider: "omniroute"
  default_model: "auto/coding:free"
  rules:
    - agent: "planner"
      provider: "omniroute"
      model: "auto/reasoning"
      complexity: "high"  

    - agent: "developer"
      provider: "omniroute"
      model: "auto/coding:free"
      complexity: "medium"    

  fallback_providers:
    - provider: "omniroute"
      model: "auto/coding:free"

    - provider: "google"
      model: "gemini-3.7-flash"

skills:
  - project-dna
  - coding-style
