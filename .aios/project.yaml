# .aios/project.yaml — Project manifest for AiosDeck
# ProjDesk prepares the development environment.
# AiosDeck prepares the intelligence environment.

name: aiosdeck
runtime: opencode
sandbox: ai-jail

routing:
  enabled: true
  default_provider: "opencode-go"
  default_model: "opencode-go/qwen3.8-flash"
  rules:
    - agent: "planner"
      provider: "opencode-go"
      model: "opencode-go/qwen3.8-flash"
      complexity: "high"  

    - agent: "developer"
      provider: "opencode-go"
      model: "opencode-go/qwen3.8-flash"
      complexity: "low"

    - agent: "reviewer"
      provider: "opencode-go"
      model: "opencode-go/qwen3.8-flash"
      complexity: "medium"

  fallback_providers:

    - provider: "google"
      model: "gemini-3.7-flash"

    - provider: "ollama"
      model: "qwen-opencode"

skills:
  - project-dna
  - coding-style
