name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Dry-run (no publish) or publish to TestPyPI"
        type: choice
        options:
          - dry-run
          - testpypi
        default: dry-run

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src/ tests/

      - name: Ruff format
        run: python -m ruff format --check src/ tests/

      - name: Pytest
        run: python -m pytest tests/ -v

      - name: Version consistency gate
        run: |
          python - <<'PY'
          import subprocess, tomllib
          from aios import __version__

          pkg = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert pkg == __version__, f"pyproject={pkg} aios.__version__={__version__}"

          if "${{ github.ref_type }}" == "tag":
              ref = "${{ github.ref_name }}"
              tag = ref.removeprefix("v")
              assert tag == pkg, f"tag={ref} pyproject={pkg}"
              out = subprocess.run(
                  ["aios", "--version"], capture_output=True, text=True
              )
              assert out.returncode == 0 and __version__ in out.stdout, out.stdout

          print(f"versions OK: aiosdeck=={__version__}")
          PY

  release:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Build
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE=$(mktemp)
          python - "$NOTES_FILE" <<'PY'
          import re, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          text = open("docs/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          body = m.group(1).strip() if m else f"AiosDeck {ver}"
          open(sys.argv[1], "w", encoding="utf-8").write(body)
          PY
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --title "AiosDeck ${{ github.ref_name }}" \
            --notes-file "$NOTES_FILE"
