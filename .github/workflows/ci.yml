name: CI

on:
  push:
    branches: [main, feature/stable-1.0]
  pull_request:
    branches: [main]

jobs:
  # --- Job 1: Validação rápida (lint + testes completos) ---
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src/ tests/

      - name: Ruff format
        run: python -m ruff format --check src/ tests/

      - name: Pytest (full suite)
        run: python -m pytest tests/ -v

  # --- Job 2: Smoke test do reviewer (existente) ---
  integration-reviewer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Reviewer CLI smoke test (read-only, JSON report)
        run: |
          aios review tests/fixtures/simple_repo --output json --dry-run > /tmp/review.json
          python -c "
          import json, sys
          data = json.load(open('/tmp/review.json'))
          assert set(data) == {'items', 'stats', 'summary'}, data
          assert isinstance(data['items'], list)
          print('reviewer CLI OK:', data['summary'])
          "

  # --- Job 3: Teste de mutação (apenas em PRs, escopado por diff no pyproject) ---
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ci  # Opcional: espera o ci passar

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para diff com a main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + mutmut
        run: pip install -e ".[dev]" mutmut

      - name: Run mutation testing
        id: scope
        run: |
          CHANGED_FILES=$(git diff origin/main...HEAD --name-only -- 'src/aios/' | grep '\.py$' | tr '\n' ' ') || true

          if [ -z "$CHANGED_FILES" ]; then
            echo "Nenhum arquivo fonte modificado. Pulando mutação."
            echo skip=true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mutmut run

      - name: Check mutation results
        if: ${{ steps.scope.outputs.skip != 'true' }}
        run: |
          echo "--- mutmut results ---"
          mutmut results || true
          mutmut export-cicd-stats
          python - <<'PY'
          import json, pathlib
          stats = json.loads(pathlib.Path("mutants/mutmut-cicd-stats.json").read_text())
          print(json.dumps(stats, indent=2))
          bad = stats["survived"] + stats["suspicious"] + stats["timeout"] + stats["segfault"]
          if bad:
              raise SystemExit(
                  f"Mutation failed: {bad} mutantes não foram mortos "
                  f"(survived={stats['survived']}, suspicious={stats['suspicious']}, "
                  f"timeout={stats['timeout']}, segfault={stats['segfault']})"
              )
          print("All relevant mutants killed.")
          PY

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: mutants/
