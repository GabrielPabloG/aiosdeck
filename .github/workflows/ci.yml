name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src/ tests/

      - name: Ruff format
        run: python -m ruff format --check src/ tests/

      - name: Pytest
        run: python -m pytest tests/ -v
