name: CI

on:
  push:
    branches: [main, feature/stable-1.0]
  pull_request:
    branches: [main]

jobs:
  # --- Job 1: Validação rápida (lint + testes completos) ---
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src/ tests/

      - name: Ruff format
        run: python -m ruff format --check src/ tests/

      - name: Pytest (full suite)
        run: python -m pytest tests/ -v

  # --- Job 2: Smoke test do reviewer (existente) ---
  integration-reviewer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Reviewer CLI smoke test (read-only, JSON report)
        run: |
          aios review tests/fixtures/simple_repo --output json --dry-run > /tmp/review.json
          python -c "
          import json, sys
          data = json.load(open('/tmp/review.json'))
          assert set(data) == {'items', 'stats', 'summary'}, data
          assert isinstance(data['items'], list)
          print('reviewer CLI OK:', data['summary'])
          "

  # --- Job 3: Teste de mutação (apenas em PRs, escopado por diff no pyproject) ---
  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: ci  # Opcional: espera o ci passar

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para diff com a main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + mutmut
        run: pip install -e ".[dev]" mutmut

      - name: Scope mutation to changed functions and run
        id: scope
        run: |
          BASE=$(git merge-base origin/main HEAD)

          # 1) arquivos Python modificados em src/aios/
          CHANGED_FILES=$(git diff "$BASE" HEAD --name-only -- 'src/aios/' | grep '\.py$' | tr '\n' ' ') || true
          if [ -z "$CHANGED_FILES" ]; then
            echo "Nenhum arquivo fonte modificado. Pulando mutação."
            echo skip=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Arquivos a serem mutados: $CHANGED_FILES"

          # 2) mutmut 3 lê source_paths do [tool.mutmut]; restringe aos arquivos mudados
          CHANGED_JSON=$(printf '%s\n' $CHANGED_FILES | python -c 'import json, sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          CHANGED_JSON="$CHANGED_JSON" python - <<'PY'
          import json, os, pathlib, re
          files = json.loads(os.environ["CHANGED_JSON"])
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          new_text, n = re.subn(
              r'source_paths = \[[^\]]*\]', f"source_paths = {json.dumps(files)}", text, count=1
          )
          assert n == 1, "source_paths not found in pyproject.toml"
          p.write_text(new_text)
          print("source_paths atualizado para:", files)
          PY

          # 3) AST sobre as linhas (+) do diff -> nomes das FUNÇÕES alteradas -> globs do mutmut
          BASE="$BASE" python - <<'PY' > changed_funcs.txt
          import ast, os, re, subprocess

          base = os.environ["BASE"]
          diff = subprocess.run(
              ["git", "diff", "-U0", base, "HEAD", "--", "src/aios/"],
              capture_output=True, text=True,
          ).stdout
          hunk = re.compile(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@')
          changed, cur = {}, None
          for line in diff.splitlines():
              if line.startswith("+++ b/"):
                  cur = line[6:]
                  changed.setdefault(cur, set())
              elif line.startswith("@@") and cur:
                  m = hunk.match(line)
                  if m:
                      start = int(m.group(1))
                      count = int(m.group(2) or 1)
                      changed[cur].update(range(start, start + count))

          names = set()
          for f, lines in changed.items():
              if not f.endswith(".py") or not os.path.exists(f) or not lines:
                  continue
              tree = ast.parse(open(f, encoding="utf-8").read())
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      span = range(node.lineno, (node.end_lineno or node.lineno) + 1)
                      if any(ln in lines for ln in span):
                          names.add(node.name)
          print("\n".join(f"*{n}*" for n in sorted(names)))
          PY

          GLOBS=()
          while IFS= read -r g; do [ -n "$g" ] && GLOBS+=("$g"); done < changed_funcs.txt
          if [ ${#GLOBS[@]} -eq 0 ]; then
            echo "Nenhuma função alterada. Pulando mutação."
            echo skip=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Escopo de mutação (funções alteradas): ${GLOBS[*]}"

          # 4) roda mutmut apenas nos mutantes das funções alteradas (fnmatch em mutant_names)
          mutmut run "${GLOBS[@]}"

      - name: Check mutation results
        if: ${{ steps.scope.outputs.skip != 'true' }}
        run: |
          echo "--- mutmut results ---"
          mutmut results || true
          python .pre-commit/check_mutation_gate.py \
            --allowlist .github/mutmut-equivalents.txt

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-report
          path: mutants/
