name: Nightly

on:
  schedule:
    # Roda todo dia às 3h da manhã (UTC)
    - cron: "0 3 * * *"
  workflow_dispatch:
    # Permite rodar manualmente pela interface do GitHub, se precisar

permissions:
  contents: read

jobs:
  # --- Job 1: Mutação completa (o mais pesado) ---
  full-mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies + mutmut
        run: pip install -e ".[dev]" mutmut

      - name: Run FULL mutation tests (entire codebase)
        # mutmut 3 lê source_paths/runner do [tool.mutmut] no pyproject.toml
        run: mutmut run

      - name: Export CI/CD stats
        if: always()
        run: mutmut export-cicd-stats

      - name: Upload full mutation report
        # sempre publica, mesmo se o gate abaixo falhar (score < 80% ou run incompleto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-mutation-report
          path: mutants/
          retention-days: 30

      # Gate por último: usa o score fair (killed/(killed+survived-equivalents)),
      # falha em run incompleto (not checked) e imprime o triage de sobreviventes.
      - name: Check mutation score (fair kill-rate, fail if < 80%)
        run: python .pre-commit/mutation_score.py --threshold 80

  # --- Job 2: Build de snapshot (opcional, mas recomendado) ---
  dev-build:
    runs-on: ubuntu-latest
    # Opcional: depende do full-mutation para não publicar se a mutação falhar
    needs: full-mutation

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine tomli-w

      - name: Bump version to dev snapshot (e.g., 1.1.0 -> 1.1.0.dev20260816)
        run: |
          python - <<'PY'
          import tomllib, tomli_w, datetime
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text())
          base_ver = data["project"]["version"]
          date_str = datetime.datetime.now(datetime.UTC).strftime("%Y%m%d")
          dev_ver = f"{base_ver}.dev{date_str}"
          data["project"]["version"] = dev_ver
          pyproject.write_text(tomli_w.dumps(data))
          print(f"Version bumped to {dev_ver}")
          PY

      - name: Build package
        run: python -m build

      - name: Validate package
        run: python -m twine check dist/*

      - name: Publish dev snapshot to TestPyPI
        if: github.ref == 'refs/heads/main'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publishing (OIDC): configure em
          #   GitHub → Settings → Developer settings (audience: pypi)
          #   TestPyPI → Your projects → <proj> → Add a new trusted publisher
          repository-url: https://test.pypi.org/legacy/
