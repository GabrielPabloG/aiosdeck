[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiosdeck"
version = "0.9.1"
description = "The AI Operating System for Developers"
readme = "docs/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Gabriel Pablo Garcia" },
]
keywords = ["ai", "agent", "orchestration", "developer-tools", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
ad = "aios.cli.main:main"
aios = "aios.cli.main:main"
aiosdeck = "aios.cli.main:main"

[project.urls]
Homepage = "https://github.com/GabrielPabloG/aiosdeck"
Documentation = "https://github.com/GabrielPabloG/aiosdeck/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/aios"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.opencode/node_modules",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["S101", "S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.5.0",
]
