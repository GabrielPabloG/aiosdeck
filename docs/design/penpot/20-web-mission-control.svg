    <text x="784" y="164" font-size="12" fill="#d7e6f2">clone flappy bird</text>
    <text x="1000" y="164" font-size="10" fill="#fbbf24" text-anchor="end">⊘ BLOCKED</text>
    <text x="784" y="184" font-size="10" fill="#9cc3d8">8/10 · t9 capability browser</text>
    <rect x="784" y="196" width="216" height="6" fill="#0b1420" stroke="#1e3a5f"/><rect x="784" y="196" width="173" height="6" fill="#2dd4bf"/><rect x="957" y="196" width="14" height="6" fill="#f87171"/>
    <text x="784" y="224" font-size="10" fill="#fbbf24">"validação visual não executável</text>
    <text x="784" y="244" font-size="10" fill="#9cc3d8"> sem browser" — E2.5 na prática</text>
