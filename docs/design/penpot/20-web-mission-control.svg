    <circle cx="435" cy="356" r="28" fill="#123a52" stroke="#2dd4bf"/><text x="435" y="360" fill="#2dd4bf">B ✓</text><text x="435" y="400" fill="#9cc3d8">contrato</text>
    <circle cx="435" cy="420" r="28" fill="#123a52" stroke="#38bdf8"/><text x="435" y="424" fill="#38bdf8">C ▸</text><text x="435" y="464" fill="#9cc3d8">impl</text>
    <circle cx="595" cy="356" r="28" fill="#10293c" stroke="#1e3a5f"/><text x="595" y="360" fill="#9cc3d8">D ○</text><text x="595" y="400" fill="#9cc3d8">testes</text>
    <circle cx="595" cy="420" r="28" fill="#10293c" stroke="#1e3a5f"/><text x="595" y="424" fill="#9cc3d8">E ○</text><text x="595" y="464" fill="#9cc3d8">bench</text>
    <circle cx="720" cy="392" r="24" fill="#10293c" stroke="#fbbf24"/><text x="720" y="396" fill="#fbbf24">F ⚠</text><text x="720" y="432" fill="#9cc3d8">merge</text>
  </g>
  <text x="256" y="506" font-size="10" fill="#1d5463">arestas: BLOCKING tracejadas · PRODUCER→CONSUMER com artefato — clique num nó abre o pod do agente</text>

