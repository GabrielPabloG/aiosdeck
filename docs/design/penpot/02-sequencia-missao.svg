<svg width="1200" height="880" viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Fira Code, monospace">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#9cc3d8"/></marker>
    <marker id="arI" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#38bdf8"/></marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#0b1420"/>

  <text x="32" y="44" font-size="22" fill="#00d4ff">◉ SEQUÊNCIA DE UMA MISSÃO TÍPICA</text>
  <text x="32" y="64" font-size="12" fill="#9cc3d8">missão: "refatorar event bus" · fluxo plan→implement→test→review→report</text>
  <line x1="32" y1="78" x2="1168" y2="78" stroke="#1e3a5f"/>

  <!-- lifelines -->
  <g font-size="12" text-anchor="middle">
    <rect x="40"  y="100" width="140" height="40" rx="2" fill="#123a52" stroke="#1e3a5f"/><text x="110" y="125" fill="#d7e6f2">Developer</text>
    <rect x="230" y="100" width="140" height="40" rx="2" fill="#123a52" stroke="#38bdf8"/><text x="300" y="125" fill="#d7e6f2">Kernel+Bus</text>
    <rect x="420" y="100" width="140" height="40" rx="2" fill="#123a52" stroke="#1e3a5f"/><text x="490" y="125" fill="#d7e6f2">Context</text>
    <rect x="610" y="100" width="140" height="40" rx="2" fill="#123a52" stroke="#1e3a5f"/><text x="680" y="125" fill="#d7e6f2">Planner</text>
    <rect x="800" y="100" width="140" height="40" rx="2" fill="#123a52" stroke="#1e3a5f"/><text x="870" y="125" fill="#d7e6f2">Exec*</text>
    <rect x="990" y="100" width="170" height="40" rx="2" fill="#123a52" stroke="#1e3a5f"/><text x="1075" y="125" fill="#d7e6f2">Tester/Reviewer</text>
  </g>
  <g stroke="#1e3a5f" stroke-dasharray="3 5">
    <line x1="110" y1="140" x2="110" y2="820"/><line x1="300" y1="140" x2="300" y2="820"/>
    <line x1="490" y1="140" x2="490" y2="820"/><line x1="680" y1="140" x2="680" y2="820"/>
    <line x1="870" y1="140" x2="870" y2="820"/><line x1="1075" y1="140" x2="1075" y2="820"/>
  </g>
  <text x="800" y="160" font-size="10" fill="#9cc3d8">* AgentExecutor → RuntimeEngine → ai-jail → Model</text>

  <!-- messages -->
  <g font-size="11">
    <line x1="110" y1="190" x2="300" y2="190" stroke="#9cc3d8" marker-end="url(#ar)"/>
    <text x="118" y="184" fill="#d7e6f2">1. ad plan "refatorar event bus"</text>

    <line x1="300" y1="235" x2="490" y2="235" stroke="#9cc3d8" marker-end="url(#ar)"/>
    <text x="308" y="229" fill="#d7e6f2">2. montar contexto do projeto</text>
    <line x1="490" y1="265" x2="300" y2="265" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arB)"/>
    <text x="308" y="259" fill="#2dd4bf">camadas (ver 03) · memory + skills</text>

    <line x1="300" y1="310" x2="680" y2="310" stroke="#9cc3d8" marker-end="url(#ar)"/>
    <text x="308" y="304" fill="#d7e6f2">3. decompor tarefa</text>
    <line x1="680" y1="350" x2="300" y2="350" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arB)"/>
    <text x="308" y="344" fill="#2dd4bf">4. tasks[1..n] com acceptance criteria declarativos (E4.5)</text>

    <line x1="300" y1="395" x2="870" y2="395" stroke="#9cc3d8" marker-end="url(#ar)"/>
    <text x="308" y="389" fill="#d7e6f2">5. task i → agente certo (capability match, E2.5)</text>

    <rect x="812" y="415" width="116" height="54" rx="2" fill="#10293c" stroke="#1e3a5f"/>
    <text x="820" y="433" font-size="10" fill="#d7e6f2">6. OpenCode</text>
    <text x="820" y="448" font-size="10" fill="#f87171">   via ai-jail</text>
    <text x="820" y="463" font-size="10" fill="#9cc3d8">   → model</text>

    <line x1="870" y1="495" x2="300" y2="495" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arB)"/>
    <text x="308" y="489" fill="#2dd4bf">7. resultado + diff + commit</text>

    <line x1="300" y1="540" x2="1075" y2="540" stroke="#9cc3d8" marker-end="url(#ar)"/>
    <text x="308" y="534" fill="#d7e6f2">8. Tester: pytest · mutmut · quality gates</text>
    <line x1="1075" y1="580" x2="300" y2="580" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arB)"/>
    <text x="308" y="574" fill="#2dd4bf">9. Reviewer: veredito (não muda arquitetura sozinho)</text>

    <line x1="300" y1="640" x2="110" y2="640" stroke="#2dd4bf" stroke-dasharray="4 3" marker-end="url(#arB)"/>
    <text x="118" y="634" fill="#2dd4bf">10. relatório: funcional + performance separados · MISSION_COMPLETE só com todos os gates</text>
  </g>

  <!-- event note -->
  <rect x="40" y="690" width="1130" height="60" rx="2" fill="none" stroke="#38bdf8" stroke-dasharray="5 4"/>
  <text x="56" y="715" font-size="11" fill="#38bdf8">passo a passo: cada transição emite eventos no bus → Telemetry registra (agent.execution.*, quality.gate.*, mission.* quando E2.1 chegar)</text>
  <text x="56" y="735" font-size="11" fill="#9cc3d8">falha em qualquer passo → cancelamento supervisionado (contrato no diagrama 04), nunca thread abandonada</text>

  <text x="32" y="850" font-size="11" fill="#9cc3d8">legenda: —— chamada/dado · ----(ciano/teal) evento/retorno · vermelho = fronteira de segurança obrigatória</text>
</svg>
